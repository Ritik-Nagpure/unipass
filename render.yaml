# Render Blueprint for UniPass
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: unipass
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_BASE_URL
        value: https://unipass.onrender.com
      - key: DEV_UI_URL
        value: https://unipass.onrender.com
      - key: PRODUCTION_URL
        value: https://unipass.onrender.com